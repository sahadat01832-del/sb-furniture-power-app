services:
  - type: web
    name: sb-furniture-power-app
    runtime: docker
    plan: 0.5c-512mb
    branch: codex/hosted-backend
    dockerfilePath: ./Dockerfile
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: sb-furniture-power-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_FILE
        value: /var/data/database.sqlite
      - key: CORS_ORIGINS
        value: "https://sb-furniture-power-app.onrender.com,https://localhost,capacitor://localhost"
